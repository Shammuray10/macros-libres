<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macros Libres</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout concept: one-column phone app. The day summary is set like a food label
   (heavy top rule, big condensed calorie figure, ruled macro rows); everything else stays quiet. */
:root{
  --bg:#F2F3EE; --surface:#FFFFFF; --ink:#15191A; --muted:#5B655F; --line:#D8DCD3; --rule:#15191A;
  --accent:#1E6B4F; --on-accent:#FFFFFF; --warn:#B3361F; --track:#E3E6DD; --overlay:rgba(10,14,12,.5);
  --p:#2B59C3; --c:#C28400; --f:#C2456A;
  --display:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101412; --surface:#181D1A; --ink:#EDF0EA; --muted:#9AA39D; --line:#2A312D; --rule:#EDF0EA;
    --accent:#5CC9A0; --on-accent:#0A1A13; --warn:#FF8E78; --track:#262D29; --overlay:rgba(0,0,0,.6);
    --p:#8CAAFF; --c:#F0B94A; --f:#F28CA8; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101412; --surface:#181D1A; --ink:#EDF0EA; --muted:#9AA39D; --line:#2A312D; --rule:#EDF0EA;
  --accent:#5CC9A0; --on-accent:#0A1A13; --warn:#FF8E78; --track:#262D29; --overlay:rgba(0,0,0,.6);
  --p:#8CAAFF; --c:#F0B94A; --f:#F28CA8; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:0 0 4px;letter-spacing:.2px}
h2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;margin:0}
h3{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.1;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0}
.eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:20px}
.stack-s{display:flex;flex-direction:column;gap:10px}

/* date bar */
.datebar{display:flex;align-items:center;gap:8px;margin:10px 0 16px}
.datelabel{flex:1;min-width:0;text-align:center;background:none;border:0;padding:10px 4px;font-weight:600;font-size:16px}
.datelabel small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.step{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;line-height:1}

/* food-label summary */
.label{background:var(--surface);border-top:8px solid var(--rule);padding:12px 16px 16px;border-bottom:1px solid var(--line)}
.label-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-bottom:1px solid var(--rule);padding-bottom:6px}
.kcal-row{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;padding-top:6px}
.kcal-n{font-family:var(--display);font-weight:700;font-size:68px;line-height:.95}
.kcal-u{font-family:var(--display);font-weight:600;font-size:22px}
.kcal-left{margin-left:auto;font-weight:600;font-size:15px}
.kcal-left.over{color:var(--warn)}
.bar{height:10px;background:var(--track);margin-top:10px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ink)}
.bar.over>i{background:var(--warn)}
.macros{margin-top:14px;border-top:4px solid var(--rule)}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0;padding-bottom:0}
.mname{font-weight:600;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;display:inline-block;flex:none}
.mval{font-weight:500;text-align:right}
.mval span{color:var(--muted);font-weight:400}
.mbar{grid-column:1/-1;height:6px;background:var(--track);overflow:hidden}
.mbar>i{display:block;height:100%}

/* meals */
.meal{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 14px 8px}
.meal-h{display:flex;align-items:center;gap:10px;padding:8px 0}
.meal-h h3{flex:1;min-width:0}
.meal-k{color:var(--muted);font-size:14px}
.add{border:1.5px solid var(--accent);color:var(--accent);background:none;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;min-height:36px}
.entries{list-style:none;margin:0;padding:0}
.entry{display:grid;grid-template-columns:1fr auto auto;gap:2px 8px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.enm{display:block;font-weight:500;overflow-wrap:anywhere}
.egm{display:block;color:var(--muted);font-size:13px}
.ek{font-weight:600;min-width:42px;text-align:right}
.icon-btn{width:36px;height:36px;border:0;background:none;border-radius:8px;font-size:22px;line-height:1;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:2px 0 8px;margin:0}

/* controls */
.btn{min-height:48px;padding:0 18px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);min-width:0}
textarea{min-height:96px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:380px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.row{display:flex;gap:10px;align-items:center}
.row>.grow{flex:1;min-width:0}
.hint{color:var(--muted);font-size:13px;margin:0}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--track);border-radius:10px;padding:3px;gap:3px}
.seg button{border:0;background:none;min-height:40px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* food lists */
.foodlist{list-style:none;margin:0;padding:0}
.food{display:flex;width:100%;text-align:left;align-items:center;gap:10px;background:none;border:0;border-top:1px solid var(--line);padding:11px 2px;min-height:52px}
.food .fn{display:block;font-weight:500;overflow-wrap:anywhere}
.food .fm{display:block;color:var(--muted);font-size:13px}
.food .fx{margin-left:auto;color:var(--muted);flex:none;font-size:13px}
.tag{font-size:11px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);margin-left:6px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(4,1fr);gap:4px;
  padding:4px max(12px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;border:0;background:none;color:var(--muted);font-size:12px;font-weight:600;border-radius:10px}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;min-height:36px;font-weight:500}
.preview{border-top:4px solid var(--rule);padding-top:8px}
.preview .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.preview .big small{font-size:20px;font-weight:600}
.pm{display:flex;gap:16px;flex-wrap:wrap;margin-top:4px;font-weight:500}
.pm span{display:inline-flex;align-items:center;gap:6px}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--body);font-size:10px;fill:var(--muted)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .goal{stroke:var(--ink);stroke-width:1.2;stroke-dasharray:4 3}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.last{fill:var(--accent)}
.chart .bk{fill:var(--ink)}
.chart .bk.today{fill:var(--accent)}
.chart .bk.over{fill:var(--warn)}
.chart .bk.none{fill:var(--track)}
.chart text.val{fill:var(--ink);font-weight:600;font-size:11px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv b{font-weight:600}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:60;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);font-size:14px;font-weight:500}
#toast button{background:none;border:0;color:inherit;font-weight:700;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion:no-preference){.bar>i,.mbar>i{transition:width .35s ease}}
</style>

<div class="wrap" id="view"></div>

</nav>

<script>
(function(){
'use strict';
/* ---------- utilidades ---------- */
const $=(s,el=document)=>el.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromYmd=s=>{const a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])};
const shift=(s,n)=>{const d=fromYmd(s);d.setDate(d.getDate()+n);return ymd(d)};
const r1=n=>Math.round(n*10)/10;
const fmt=n=>Math.round(n).toLocaleString('es-ES');
const fmt1=n=>r1(n).toLocaleString('es-ES');
const num=v=>{const n=parseFloat(String(v).trim().replace(',','.'));return isFinite(n)?n:NaN};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));

/* ---------- datos ---------- */
const KEY='macros_libres_v1';
const DEF=()=>({goals:{kcal:2000,p:150,c:200,f:65},profile:{sex:'m',age:'',h:'',w:'',act:'1.55',obj:'mant'},foods:[],log:{},weights:[],recents:[]});
let storageOK=true;
function load(){
  try{
    const r=localStorage.getItem(KEY);
    if(r){const o=JSON.parse(r);return Object.assign(DEF(),o);}
  }catch(e){storageOK=false}
  return DEF();
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){storageOK=false}}
try{localStorage.setItem(KEY+'_t','1');localStorage.removeItem(KEY+'_t');}catch(e){storageOK=false}

/* Valores medios aproximados por 100 g: nombre|kcal|proteína|hidratos|grasa|ración (g) */
const RAW=`Pechuga de pollo (cruda)|110|23|0|1.5|150
Pechuga de pollo (cocinada)|165|31|0|3.6|130
Muslo de pollo sin piel (cocido)|175|26|0|8|120

const BUILTIN=RAW.trim().split('\n').map((l,i)=>{const a=l.split('|');
  return{id:'b'+i,name:a[0],kcal:+a[1],p:+a[2],c:+a[3],f:+a[4],serving:+a[5]||100,builtin:true}});
const allFoods=()=>S.foods.concat(BUILTIN);
const foodById=id=>allFoods().find(f=>f.id===id);
const MEALS=[['des','Desayuno'],['com','Comida'],['mer','Merienda'],['cen','Cena']];
const mealName=k=>(MEALS.find(m=>m[0]===k)||['','Comida'])[1];
const macroOf=(food,g)=>({kcal:food.kcal*g/100,p:food.p*g/100,c:food.c*g/100,f:food.f*g/100});

function dayTotals(date){
  const t={kcal:0,p:0,c:0,f:0};
  for(const e of (S.log[date]||[])){t.kcal+=e.kcal;t.p+=e.p;t.c+=e.c;t.f+=e.f}
  return t;
}

/* ---------- estado de interfaz ---------- */
const TODAY=()=>ymd(new Date());
let cur=TODAY();
let tab='hoy';
let foodQ='';
let addState=null;
let calcResult=null;
let confirmKey=null,confirmTimer=null;
let lastRemoved=null;
let dl=null;
try{
  if(window.claude&&window.claude.use){window.claude.use('downloads').then(m=>{dl=m;if(tab==='aj')render()}).catch(()=>{})}
}catch(e){}

/* ---------- vistas ---------- */
function barPct(v,goal){return goal>0?clamp(v/goal*100,0,100):0}

function viewHoy(){
  const t=dayTotals(cur),g=S.goals;
  const left=g.kcal-t.kcal,over=left<0;
  const isToday=cur===TODAY();
  const dl_=cap(fromYmd(cur).toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}));
  const macro=(nm,key,col)=>`<div class="mrow"><span class="mname"><i class="dot" style="background:var(${col})"></i>${nm}</span>
    <span class="mval num">${fmt(t[key])} <span>/ ${fmt(g[key])} g</span></span>
    <div class="mbar"><i style="width:${barPct(t[key],g[key])}%;background:var(${col})"></i></div></div>`;
  const meals=MEALS.map(([k,n])=>{

function niceRange(min,max){
  let lo=Math.floor(min-0.5),hi=Math.ceil(max+0.5);
  if(hi-lo<2){hi=lo+2}
  return [lo,hi];
}
function weightChart(){
  const ws=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-30);
  if(!ws.length)return `<p class="empty">Aún no hay pesos. Añade el primero arriba.</p>`;
  const W=340,H=160,L=36,R=14,T=14,B=24;
  const vals=ws.map(w=>w.kg);
  const [lo,hi]=niceRange(Math.min(...vals),Math.max(...vals));
  const t0=fromYmd(ws[0].d).getTime(),t1=fromYmd(ws[ws.length-1].d).getTime();
  const X=d=>ws.length===1?L+(W-L-R)/2:L+(fromYmd(d).getTime()-t0)/((t1-t0)||1)*(W-L-R);
  const Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  const ticks=[lo,(lo+hi)/2,hi];
  const grid=ticks.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt1(v)}</text>`).join('');
  const pts=ws.map(w=>[X(w.d),Y(w.kg)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const last=ws[ws.length-1],lp=pts[pts.length-1];
  const short=d=>fromYmd(d).toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const anchorLast=lp[0]>W-60?'end':'middle';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolución del peso">
    ${grid}
    ${ws.length>1?`<path class="ln" d="${path}"/>`:''}
    ${pts.map((p,i)=>`<circle class="pt ${i===pts.length-1?'last':''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4.5:3}"/>`).join('')}
    <text class="val" x="${lp[0].toFixed(1)}" y="${(lp[1]-9).toFixed(1)}" text-anchor="${anchorLast}">${fmt1(last.kg)} kg</text>
    <text x="${L}" y="${H-6}" text-anchor="start">${short(ws[0].d)}</text>
    ${ws.length>1?`<text x="${W-R}" y="${H-6}" text-anchor="end">${short(last.d)}</text>`:''}
  </svg>`;
}
function kcalChart(){
  const days=[];for(let i=6;i>=0;i--)days.push(shift(TODAY(),-i));
  const data=days.map(d=>({d,k:dayTotals(d).kcal,has:(S.log[d]||[]).length>0}));
  const goal=S.goals.kcal;
  const W=340,H=170,L=36,R=14,T=16,B=24;
  const mx=Math.max(goal*1.15,...data.map(x=>x.k*1.08),100);
  const Y=v=>T+(1-v/mx)*(H-T-B);
  const bw=(W-L-R)/7;
  const letters=['D','L','M','X','J','V','S'];
  const bars=data.map((x,i)=>{
    const cls=!x.has?'none':x.d===TODAY()?'today':(x.k>goal*1.0?'over':'');
    const h=x.has?Math.max(2,Y(0)-Y(x.k)):2;
    const bx=L+i*bw+bw*0.18,w=bw*0.64;
    return `<rect class="bk ${cls}" x="${bx.toFixed(1)}" y="${(Y(0)-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="2"/>
      ${x.has?`<text class="val" x="${(bx+w/2).toFixed(1)}" y="${(Y(0)-h-4).toFixed(1)}" text-anchor="middle">${fmt(x.k/10)*1===0?'':fmt(x.k)}</text>`:''}
      <text x="${(bx+w/2).toFixed(1)}" y="${H-8}" text-anchor="middle">${letters[fromYmd(x.d).getDay()]}</text>`}).join('');
  const gt=[0,Math.round(mx/2/100)*100,Math.round(mx/100)*100].filter((v,i,a)=>v<=mx&&a.indexOf(v)===i);
  const grid=gt.map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v)}</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías de los últimos 7 días">
    ${grid}
    <line class="goal" x1="${L}" x2="${W-R}" y1="${Y(goal)}" y2="${Y(goal)}"/>
    <text x="${W-R}" y="${Y(goal)-4}" text-anchor="end">objetivo ${fmt(goal)}</text>
    ${bars}</svg>`;
}

    </section></div>`;

function resultsHTML(){
  const q=norm(addState.q.trim());
  let list,head='';
  if(!q){
    const rec=S.recents.map(foodById).filter(Boolean);
    const seen=new Set(rec.map(f=>f.id));
    list=rec.concat(S.foods.filter(f=>!seen.has(f.id)));
    if(list.length)head=`<p class="lbl">Recientes y propios</p>`;
    else return `<p class="empty">Escribe para buscar entre ${BUILTIN.length} alimentos, o crea los tuyos en la pestaña Alimentos.</p>`;
  }else{
    list=allFoods().filter(f=>norm(f.name).includes(q)||(f.barcode&&f.barcode.includes(q)));
  }
  if(!list.length){
    const isCode=/^\d{6,}$/.test(addState.q.trim());
    return `<p class="empty">${isCode?'Ningún alimento propio tiene ese código.':'Sin resultados para «'+esc(addState.q)+'».'}</p>

  return head+`<ul class="foodlist">${list.slice(0,40).map(f=>`<li><button class="food" data-act="pick" data-id="${f.id}">

    <span class="fx num">${f.serving} g</span></button></li>`).join('')}</ul>`;
}

      <div class="field"><label for="ff-f">Grasa (g)</label><input id="ff-f" type="text" inputmode="decimal" value="${v.f??''}"></div></div>
      <p class="hint num" id="fhint"></p>
      <div class="field"><label for="ff-s">Ración habitual (g)</label><input id="ff-s" type="text" inputmode="decimal" value="${v.serving??100}"></div>
      <div class="field"><label for="ff-b">Código de barras (opcional)</label>
        <div class="row"><div class="grow"><input id="ff-b" type="text" inputmode="numeric" value="${esc(v.barcode||'')}"></div>
        ${canScan?`<button class="btn" data-act="scan" data-t="food" style="min-height:48px">Foto código</button>`:''}</div></div>
      <button class="btn primary block" data-act="savefood">Guardar</button>
      ${f?`<button class="btn danger block" data-act="delfood" data-id="${f.id}">Eliminar alimento</button>`:''}
    </div>`);
  updateHint();
}
function updateHint(){
  const h=$('#fhint');if(!h)return;
  const p=num($('#ff-p').value),c=num($('#ff-c').value),f=num($('#ff-f').value);
  if(isNaN(p)&&isNaN(c)&&isNaN(f)){h.textContent='';return}
  const k=(isNaN(p)?0:p)*4+(isNaN(c)?0:c)*4+(isNaN(f)?0:f)*9;
  h.textContent='Por sus macros salen unas '+fmt(k)+' kcal por 100 g.';
}

/* lector de código por foto */
let scanTarget='search';
async function readBarcode(file){
  try{
    const det=new BarcodeDetector();
    const bmp=await createImageBitmap(file);
    const r=await det.detect(bmp);
    return r.length?r[0].rawValue:null;
  }catch(e){return null}
}
$('#scanfile').addEventListener('change',async e=>{
  const file=e.target.files&&e.target.files[0];e.target.value='';
  if(!file)return;
  const code=await readBarcode(file);
  if(!code){toast('No se pudo leer el código. Acércate, con buena luz, o escríbelo a mano.');return}
  if(scanTarget==='food'){const b=$('#ff-b');if(b)b.value=code;toast('Código leído: '+code)}
  else if(addState){addState.q=code;addState.sel=null;renderAdd();toast('Código leído: '+code)}
});

/* ---------- acciones ---------- */
function needConfirm(key,btn,label){
  if(confirmKey===key){confirmKey=null;clearTimeout(confirmTimer);return true}
  confirmKey=key;const old=btn.textContent;btn.textContent=label;
  clearTimeout(confirmTimer);
  confirmTimer=setTimeout(()=>{confirmKey=null;if(btn.isConnected)btn.textContent=old},4000);
  return false;
}
function readGoals(){
  const k=num($('#gk').value),p=num($('#gp').value),c=num($('#gc').value),f=num($('#gf').value);
  if([k,p,c,f].some(x=>isNaN(x)||x<0)||k<=0)return null;
  return{kcal:Math.round(k),p:Math.round(p),c:Math.round(c),f:Math.round(f)};
}
function doCalc(){
  const sex=$('#cs').value,age=num($('#ca').value),h=num($('#ch').value),w=num($('#cw').value),act=$('#cact').value,obj=$('#cobj').value;
  S.profile={sex,age:$('#ca').value,h:$('#ch').value,w:$('#cw').value,act,obj};save();
  if([age,h,w].some(x=>isNaN(x)||x<=0)){calcResult={error:'Rellena edad, altura y peso con números válidos.'};return}
  const bmr=10*w+6.25*h-5*age+(sex==='m'?5:-161);
  const tdee=bmr*parseFloat(act);
  const kcal=Math.round(tdee*(obj==='perder'?0.8:obj==='ganar'?1.1:1)/10)*10;
  const p=Math.round(w*(obj==='perder'?2.0:1.8));
  const f=Math.round(kcal*0.25/9);
  const c=Math.max(0,Math.round((kcal-p*4-f*9)/4));
  calcResult={tdee:Math.round(tdee/10)*10,kcal,p,c,f};
}
function exportJSON(){return JSON.stringify({app:'macros-libres',v:1,data:S})}
function dateStamp(){return TODAY()}

async function act(a,b,ev){
  switch(a){
    case 'noop':return;
    case 'tab':tab=b.dataset.v;render();window.scrollTo(0,0);return;
    case 'day':cur=shift(cur,+b.dataset.v);render();return;
    case 'today':cur=TODAY();render();return;
    case 'add':openAdd(b.dataset.meal);return;
    case 'close':closeSheet();return;
    case 'addtab':addState.tab=b.dataset.v;addState.sel=null;renderAdd();return;
    case 'pick':addState.sel=b.dataset.id;addState.g=null;renderAdd();return;
    case 'unsel':addState.sel=null;renderAdd();return;
    case 'gchip':{const i=$('#grams');i.value=b.dataset.v;$('#preview').innerHTML=previewHTML(foodById(addState.sel),i.value);return}
    case 'doadd':{
      const f=foodById(addState.sel),g=num($('#grams').value);
      if(isNaN(g)||g<=0){toast('Indica una cantidad en gramos.');return}
      pushEntry(addState.meal,f.name,g,macroOf(f,g),f.id);
      closeSheet();render();toast('Añadido: '+f.name);return;
    }
    case 'doquick':{
      let k=num($('#qk').value),p=num($('#qp').value),c=num($('#qc').value),f=num($('#qf').value);
      const P=isNaN(p)?0:p,C=isNaN(c)?0:c,F=isNaN(f)?0:f;
      if(isNaN(k))k=P*4+C*4+F*9;
      if(!(k>0)){toast('Indica calorías o algún macro.');return}
      pushEntry(addState.meal,($('#qn').value.trim()||'Entrada rápida'),0,{kcal:k,p:P,c:C,f:F},null);
      closeSheet();render();toast('Añadido');return;
    }
    case 'del':{
      const arr=S.log[cur]||[];const i=arr.findIndex(e=>e.id===b.dataset.id);
      if(i<0)return;
      lastRemoved={date:cur,i,e:arr[i]};arr.splice(i,1);
      if(!arr.length)delete S.log[cur];
      save();render();toast('Quitado: '+lastRemoved.e.name,true);return;
    }
    case 'undo':{
      if(lastRemoved){const l=lastRemoved;const arr=(S.log[l.date]=S.log[l.date]||[]);arr.splice(Math.min(l.i,arr.length),0,l.e);save();lastRemoved=null;$('#toast').hidden=true;render()}
      return;
    }
    case 'newfood':openFoodForm(null);return;
    case 'newfromsearch':{
      const q=addState.q.trim();const isCode=/^\d{6,}$/.test(q);
      closeSheet();openFoodForm(null,isCode?{barcode:q}:{name:q});return;
    }
    case 'editfood':openFoodForm(b.dataset.id);return;
    case 'scan':scanTarget=b.dataset.t;$('#scanfile').click();return;
    case 'savefood':{
      const form=$('#foodform');const name=$('#ff-n').value.trim();
      const k=num($('#ff-k').value),p=num($('#ff-p').value),c=num($('#ff-c').value),f=num($('#ff-f').value),s=num($('#ff-s').value);
      if(!name){toast('Escribe un nombre.');return}
      const P=isNaN(p)?0:p,C=isNaN(c)?0:c,F=isNaN(f)?0:f;
      const K=isNaN(k)?P*4+C*4+F*9:k;
      if(!(K>=0)||(K===0&&P+C+F===0&&isNaN(k))){toast('Indica calorías o macros por 100 g.');return}
      const obj={name,kcal:r1(K),p:r1(P),c:r1(C),f:r1(F),serving:(isNaN(s)||s<=0)?100:s,barcode:$('#ff-b').value.trim()};
      const id=form.dataset.fid;
      if(id){const i=S.foods.findIndex(x=>x.id===id);if(i>=0)S.foods[i]=Object.assign({id},obj)}
      else S.foods.unshift(Object.assign({id:'c'+uid()},obj));
      save();closeSheet();render();toast('Alimento guardado');return;
    }
    case 'delfood':{
      if(!needConfirm('df'+b.dataset.id,b,'Pulsa otra vez para eliminar'))return;
      S.foods=S.foods.filter(x=>x.id!==b.dataset.id);S.recents=S.recents.filter(x=>x!==b.dataset.id);
      save();closeSheet();render();toast('Alimento eliminado');return;
    }
    case 'addweight':{
      const d=$('#wd').value||TODAY(),kg=num($('#wk').value);
      if(isNaN(kg)||kg<20||kg>400){toast('Indica un peso válido en kg.');return}
      S.weights=S.weights.filter(w=>w.d!==d);S.weights.push({d,kg:r1(kg)});save();render();toast('Peso guardado');return;
    }
    case 'delweight':S.weights=S.weights.filter(w=>w.d!==b.dataset.d);save();render();return;
    case 'savegoals':{
      const g=readGoals();if(!g){toast('Revisa los objetivos: deben ser números y las calorías mayores que 0.');return}
      S.goals=g;save();toast('Objetivos guardados');return;
    }
    case 'calc':doCalc();$('#calcout').innerHTML=calcOut();return;
    case 'usecalc':S.goals={kcal:calcResult.kcal,p:calcResult.p,c:calcResult.c,f:calcResult.f};save();render();toast('Objetivos actualizados');return;
    case 'exportfile':{
      try{await dl.save({filename:'macros-libres-'+dateStamp()+'.json',data:exportJSON()});toast('Copia guardada')}
      catch(e){if(!e||e.code!=='declined')toast('No se pudo guardar el archivo. Prueba con copiar al portapapeles.')}
      return;
    }
    case 'exportcopy':{
      const txt=exportJSON();
      try{await navigator.clipboard.writeText(txt);toast('Copia en el portapapeles. Pégala en un lugar seguro.')}
      catch(e){const t=$('#imp');t.value=txt;t.focus();t.select();toast('Selecciona el texto y cópialo a mano.')}
      return;
    }
    case 'import':{
      const raw=$('#imp').value.trim();
      let o=null;try{o=JSON.parse(raw)}catch(e){}
      const d=o&&o.app==='macros-libres'&&o.data?o.data:null;
      if(!d||typeof d.log!=='object'||typeof d.goals!=='object'){toast('Ese texto no es una copia válida de Macros Libres.');return}
      if(!needConfirm('imp',b,'Pulsa otra vez: sustituye tus datos actuales'))return;
      S=Object.assign(DEF(),d);save();calcResult=null;render();toast('Copia restaurada');return;
    }
    case 'wipe':{
      if(!needConfirm('wipe',b,'Pulsa otra vez para borrar todo'))return;
      S=DEF();save();calcResult=null;cur=TODAY();render();toast('Datos borrados');return;
    }
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  act(b.dataset.act,b,e);
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='fq'){foodQ=e.target.value;$('#foodlist').innerHTML=foodListHTML()}
  else if(id==='q'&&addState){addState.q=e.target.value;$('#results').innerHTML=resultsHTML()}
  else if(id==='grams'&&addState&&addState.sel){addState.g=e.target.value;$('#preview').innerHTML=previewHTML(foodById(addState.sel),e.target.value)}
  else if(id==='ff-p'||id==='ff-c'||id==='ff-f')updateHint();
});

render();
})();
</script>
